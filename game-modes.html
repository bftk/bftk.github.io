    <style>
    /* バトルの流れ: 各ステップに挿絵の枠を置く（画像は準備中） */
    .flow-step { display: grid; grid-template-columns: 1fr 240px; gap: 1.4rem; align-items: start; }
    .flow-figure {
        aspect-ratio: 4 / 3;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(249,168,37,0.15);
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        color: #555; font-size: 0.7rem; letter-spacing: 0.1em;
    }
    .flow-figure img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
    .ace-card .flow-figure { margin-bottom: 0.9rem; }
    @media (max-width: 700px) {
        .flow-step { grid-template-columns: 1fr; gap: 1rem; }
        .flow-figure { max-width: 320px; }
    }
    </style>
    <meta property="og:title" content="対戦モード - BFTK">
