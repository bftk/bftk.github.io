<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勢力 - BFTK</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="canonical" href="https://bftk-game.com/characters.html">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 仮プレビュー: 勢力ハブ（5枚を横1列・3:4） ===== */
        /* このページ限定。style.css は変更しない */
        .hub-grid { grid-template-columns: repeat(5, 1fr); }

        /* 矢印を使わないので右paddingの名残を左と揃える */
        .hub-panel { padding-right: 1.6rem; }

        .hub-panel .fa-figure {
            margin: -1.6rem -1.6rem 1.6rem;
            aspect-ratio: 3 / 4;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .hub-panel .fa-figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 左端の金帯は使わない（プレイガイドと同じ扱い） */
        .hub-panel::before { display: none; }

        /* 見出し帯: 通常は暗く、ホバーで金地に反転 */
        .hub-panel .hub-panel-title {
            margin: 0 -1.6rem -1.6rem;
            padding: 1.1rem 0.6rem;
            font-size: 1.15rem;
            text-align: center;
            letter-spacing: 0.03em;
            transition: background 0.3s, color 0.3s;
        }
        .hub-panel:hover .hub-panel-title {
            background: #F9A825;
            color: #0a0a0a;
        }

        /* ヒーローを少し圧縮（プレイガイドと同じ調整） */
        .hub-hero { padding: clamp(2.8rem, 5.6vw, 4rem) 1.5rem 2rem; }
        .hub-panels { padding-top: 1.5rem; }


        @media (max-width: 600px) {
            /* 5枚を1列にすると1枚477pxで長すぎるため2列にする */
            .hub-grid { grid-template-columns: 1fr 1fr; }
            .hub-panel { padding-left: 1.2rem; padding-right: 1.2rem; }
            .hub-panel .fa-figure { margin: -1.2rem -1.2rem 1.2rem; }
            .hub-panel .hub-panel-title {
                margin: 0 -1.2rem -1.2rem;
                padding: 0.9rem 0.4rem;
                font-size: 1rem;
            }
            .hub-hero { padding: 3rem 1.2rem 1.6rem; }
            .hub-panels { padding-top: 1.2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">BFTK</a>
        <div class="nav-links">
            <a href="world.html">世界観</a>
            <a href="game.html">遊び方</a>
            <a href="characters.html" class="active">勢力</a>
            <a href="faq.html">FAQ</a>
        </div>
    </nav>

    <section class="hub-hero">
        <div class="hub-hero-bg" aria-hidden="true">ARCHIVE</div>
        <div class="hub-hero-inner">
            <p class="hub-hero-label">FACTION ARCHIVE</p>
            <h1 class="hub-hero-title">四つの勢力、一つの王座。</h1>
            <p class="hub-hero-sub">獣人たちは、それぞれの思想と欲望を掲げ、覇権を争う。</p>
        </div>
    </section>

    <section class="hub-panels">
        <div class="hub-grid">
        <a href="characters-grassland.html" class="hub-panel" data-reveal>
            <div class="fa-figure"><img src="assets/faction/faction-grassland.webp" alt="草原" width="900" height="1200" loading="lazy"></div>
            <h2 class="hub-panel-title">草原</h2>
        </a>
        <a href="characters-forest.html" class="hub-panel" data-reveal>
            <div class="fa-figure"><img src="assets/faction/faction-forest.webp" alt="森林" width="900" height="1200"></div>
            <h2 class="hub-panel-title">森林</h2>
        </a>
        <a href="characters-mountain.html" class="hub-panel" data-reveal>
            <div class="fa-figure"><img src="assets/faction/faction-mountain.webp" alt="山岳" width="900" height="1200" loading="lazy"></div>
            <h2 class="hub-panel-title">山岳</h2>
        </a>
        <a href="characters-ruins.html" class="hub-panel" data-reveal>
            <div class="fa-figure"><img src="assets/faction/faction-ruins.webp" alt="廃墟" width="900" height="1200" loading="lazy"></div>
            <h2 class="hub-panel-title">廃墟</h2>
        </a>
        <a href="characters-other.html" class="hub-panel" data-reveal>
            <div class="fa-figure"><img src="assets/faction/faction-lost.webp" alt="その他" width="900" height="1200" loading="lazy"></div>
            <h2 class="hub-panel-title">その他</h2>
        </a>
        </div>
    </section>


    <a href="chat.html" class="chat-fab" aria-label="キャラと話す"><img src="chat-icon.webp" alt="キャラと話す"></a>
    <footer>
        <a href="privacy.html">プライバシーポリシー</a>｜<a href="terms.html">利用規約</a>｜<a href="rates.html">提供割合</a>｜<a href="company.html">運営者情報</a>
        <p style="margin-top: 0.5rem;">&copy; HIAS</p>
    </footer>
    <script>
    document.addEventListener('DOMContentLoaded',()=>{const o=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('is-visible');o.unobserve(x.target)}})},{threshold:0.12});document.querySelectorAll('[data-reveal]').forEach(el=>o.observe(el))});
    </script>
</body>
</html>
