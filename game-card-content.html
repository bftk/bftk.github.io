    /* カードの見方（絵＋項目） */
    .card-anatomy { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; align-items: start; margin-top: 1.5rem; }
    .card-anatomy .video-placeholder { max-width: none; aspect-ratio: 3 / 4; margin: 0; }

    /* カード見本。★ゲーム内SR箔と同じ素材・同じ層構成（黄金6層）を screen 合成で重ねる。
       ★光は「時間で流れる」のではなく「傾けた結果」動く＝ゲーム側と同じ考え方。 */
    .card-sr { width: 100%; perspective: 900px; }
    .card-sr__stage {
        position: relative;
        width: 100%;
        aspect-ratio: 832 / 1216;
        border-radius: 12px;
        overflow: hidden;
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(.22,.61,.36,1);
        will-change: transform;
        cursor: grab;
    }
    .card-sr__stage.is-live { transition: transform 0.08s linear; cursor: grabbing; }
    .card-sr__stage > img,
    .card-sr__stage > canvas {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        display: block; object-fit: cover;
        pointer-events: none;
    }
    /* 箔は加算。ブラウザでは screen（黒が透明）で近似する */
    .card-sr__foil { mix-blend-mode: screen; opacity: 0; will-change: opacity, -webkit-mask-position; }
    .card-sr__dust { mix-blend-mode: screen; }
    .card-sr__flip {
        display: block; margin: 0.9rem auto 0;
        background: none; border: 1px solid rgba(249,168,37,0.35);
        color: #F9A825; border-radius: 999px;
        padding: 0.45rem 1.4rem; font-size: 0.82rem; letter-spacing: 0.08em;
        cursor: pointer; transition: background 0.25s, border-color 0.25s;
    }
    .card-sr__flip:hover { background: rgba(249,168,37,0.10); border-color: rgba(249,168,37,0.6); }
    /* ★動きを減らす設定の人には傾けも箔も動かさない */
    @media (prefers-reduced-motion: reduce) {
        .card-sr__stage { transition: none; }
    }
    @media (max-width: 700px) {
        .card-anatomy { grid-template-columns: 1fr; gap: 1.2rem; }
        .card-anatomy .video-placeholder { max-width: 320px; }
    }
    </style>

<script>
/* SRカードの箔。★ゲーム内(CardTiltPrototype)と同じ考え方:
   ・光は「時間で流れる」のではなく「傾けた結果」帯の位置が動く
   ・金粉だけが時間で舞う（粒ごとに速度・大きさ・明るさ・明滅を持つ）
   ・層ごとの強さと帯幅は Unity で確定した値に合わせる           */
(function () {
    var stage = document.getElementById('srCard');
    var dust  = document.getElementById('srDust');
    if (!stage || !dust) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Unity の確定値（強さ, 帯幅, 芯）。帯幅は「カードの対角に対する割合」 */
    var LAYERS = {
        gold:  { power: 0.45, width: 0.22,  core: 0 },
        base:  { power: 0.55, width: 0.35,  core: 0 },
        flake: { power: 0.29, width: 0.53,  core: 0 },
        shine: { power: 1.00, width: 0.16,  core: 1 },
        glint: { power: 0.85, width: 0.045, core: 0 }
    };
    var ANGLE = 62;                       /* 帯の角度。ゲームと同じ */
    var foils = [].slice.call(stage.querySelectorAll('.card-sr__foil'));

    /* 帯 = 角度62度の線形グラデーションのマスク。中心を tilt で動かす */
    function maskFor(width, center, core) {
        var w = Math.max(2, width * 100);
        var c = center * 100;
        var stops = [
            'transparent ' + (c - w) + '%',
            'rgba(0,0,0,0.35) ' + (c - w * 0.45) + '%',
            'rgba(0,0,0,1) ' + c + '%',
            'rgba(0,0,0,0.35) ' + (c + w * 0.45) + '%',
            'transparent ' + (c + w) + '%'
        ];
        if (core) {                       /* シャインは帯の中心に鋭い芯を持つ */
            stops.splice(3, 0, 'rgba(0,0,0,0.9) ' + (c + w * 0.12) + '%');
        }
        return 'linear-gradient(' + ANGLE + 'deg, ' + stops.join(', ') + ')';
    }

    var tx = 0, ty = 0, curX = 0, curY = 0, dragging = false, px = 0, py = 0;
    var flipDeg = 0;   /* ★めくりの角度。傾きと足し合わせる */
    var hovering = false;

    function apply() {
        var deg = 22;
        stage.style.transform = 'rotateX(' + (curY * deg) + 'deg) rotateY(' + (curX * deg + flipDeg) + 'deg)';
        /* ★帯の中心は傾きで決まる（ゲームの center = 0.5 + tiltY*0.45 - tiltX*0.30 と同じ） */
        /* ★振り幅を広げた（0.45/0.30 → 0.75/0.55）。帯がカードを端まで走り切る */
        var center = 0.5 + (curX * 0.75) - (curY * 0.55);
        var lean = Math.min(1, Math.sqrt(curX * curX + curY * curY));
        for (var i = 0; i < foils.length; i++) {
            var el = foils[i], L = LAYERS[el.getAttribute('data-foil')];
            if (!L) continue;
            var m = maskFor(L.width, center, L.core);
            el.style.webkitMaskImage = m;
            el.style.maskImage = m;
            /* 正面でも少し見えるように下限を持たせる（ゲームと同じ考え方） */
            el.style.opacity = (L.power * (0.55 + 0.45 * lean)).toFixed(3);
        }
    }

    function setTarget(nx, ny) { tx = Math.max(-1, Math.min(1, nx)); ty = Math.max(-1, Math.min(1, ny)); }

    /* ホバー/指の位置で傾ける。ドラッグ中はそのまま追従 */
    stage.addEventListener('pointermove', function (e) {
        var r = stage.getBoundingClientRect();
        setTarget(((e.clientX - r.left) / r.width - 0.5) * 2, ((e.clientY - r.top) / r.height - 0.5) * 2);
        stage.classList.add('is-live');
        hovering = true;
    });
    stage.addEventListener('pointerleave', function () {
        hovering = false; stage.classList.remove('is-live');
    });
    stage.addEventListener('pointerdown', function (e) { dragging = true; px = e.clientX; py = e.clientY; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointerup',  function () { dragging = false; });

    /* ---- 金粉。★唯一「時間で動く」層。粒ごとに速度・大きさ・明るさ・明滅を持つ ---- */
    var ctx = dust.getContext('2d'), grains = [], t = 0, dpr = 1;
    function sizeCanvas() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        var r = stage.getBoundingClientRect();
        dust.width = Math.max(1, Math.round(r.width * dpr));
        dust.height = Math.max(1, Math.round(r.height * dpr));
    }
    function makeGrains() {
        grains.length = 0;
        /* ★粒を増やした（/5200 → /2200）。面積に比例させるので端末で密度が変わらない */
        var n = Math.round(dust.width * dust.height / 2200);
        for (var i = 0; i < n; i++) {
            var r = Math.random();
            var bright = r < 0.80 ? 0.35 + Math.random() * 0.15
                       : r < 0.95 ? 0.55 + Math.random() * 0.15
                                  : 0.75 + Math.random() * 0.25;
            grains.push({
                x: Math.random(), y: Math.random(),
                dir: (54 + (Math.random() - 0.5) * 26) * Math.PI / 180,     /* 向き54度・ばらつきを広げた */
                spd: 0.024 * (0.6 + bright * 0.8),                          /* 明るい粒ほど速い＝奥行き */
                size: (0.9 + bright * 2.1) * dpr,
                bright: bright,
                phase: Math.random() * Math.PI * 2,
                rate: 0.6 + Math.random() * 1.2
            });
        }
    }
    function drawDust(dt) {
        ctx.clearRect(0, 0, dust.width, dust.height);
        var lean = Math.min(1, Math.sqrt(curX * curX + curY * curY));
        var gain = 0.80 + 0.35 * lean;              /* 傾けるほど濃く。正面でも見える */
        for (var i = 0; i < grains.length; i++) {
            var g = grains[i];
            g.x += Math.cos(g.dir) * g.spd * dt;
            g.y -= Math.sin(g.dir) * g.spd * dt;
            /* ⚠端で折り返すと明るいまま飛ぶので、外周で消してから戻す */
            if (g.x > 1.05) { g.x = -0.05; } else if (g.x < -0.05) { g.x = 1.05; }
            if (g.y > 1.05) { g.y = -0.05; } else if (g.y < -0.05) { g.y = 1.05; }
            var edge = Math.min(1, Math.min(g.x, 1 - g.x, g.y, 1 - g.y) / 0.05);
            if (edge <= 0) continue;
            var blink = 0.5 + 0.5 * Math.sin(t * g.rate + g.phase);
            var a = g.bright * blink * gain * edge;
            ctx.fillStyle = 'rgba(255,242,200,' + a.toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(g.x * dust.width, g.y * dust.height, g.size, 0, 6.283);
            ctx.fill();
        }
    }

    /* ---- めくり。★表(箔あり) → 裏1 → 裏2 → 表 の3面を回す ---- */
    var FACES = [
        { src: 'card-anubi.webp',    alt: 'カードの見本（アヌビ）',   foil: true  },
        { src: 'card-anubi-b1.webp', alt: 'カード裏1（素性）',      foil: false },
        { src: 'card-anubi-b2.webp', alt: 'カード裏2（スキル）',     foil: false }
    ];
    var face = document.getElementById('srFace');
    var idx = 0, flipping = false;

    function flip() {
        if (flipping) return;
        flipping = true;
        var t0 = performance.now(), DUR = 190, half = false;
        (function step(now) {
            var e = Math.min(1, (now - t0) / DUR);
            /* ⚠ 90度で面を差し替える。180度まで回すと中身が鏡像になる */
            if (!half) {
                flipDeg = 90 * e;
                if (e >= 1) {
                    half = true; t0 = now; flipDeg = -90;
                    idx = (idx + 1) % FACES.length;
                    face.src = FACES[idx].src;
                    face.alt = FACES[idx].alt;
                    for (var i = 0; i < foils.length; i++) {
                        foils[i].style.display = FACES[idx].foil ? '' : 'none';
                    }
                    dust.style.display = FACES[idx].foil ? '' : 'none';
                }
                requestAnimationFrame(step);
                return;
            }
            flipDeg = -90 * (1 - e);
            if (e >= 1) { flipDeg = 0; flipping = false; return; }
            requestAnimationFrame(step);
        })(t0);
    }
    stage.addEventListener('click', flip);
    var flipBtn = document.getElementById('srFlip');
    if (flipBtn) flipBtn.addEventListener('click', function (e) { e.stopPropagation(); flip(); });

    var last = 0;
    function loop(now) {
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        /* 指を離したら中央へ戻る（ゲームの ReturnSpeed と同じ挙動） */
        var k = dragging ? 1 : Math.min(1, dt * 7);
        /* ★触っていない間はゆっくり揺れる。見本なので放っておいても箔が走る。
           ⚠ゲーム側は「傾けた結果だけ」で動く。ここはHP専用の振る舞い */
        if (!hovering) {
            tx = Math.sin(t * 0.55) * 0.85;
            ty = Math.cos(t * 0.37) * 0.45;
        }
        curX += (tx - curX) * k;
        curY += (ty - curY) * k;
        if (!reduce) { t += dt; }
        apply();
        if (!reduce) { drawDust(dt); }
        requestAnimationFrame(loop);
    }
    sizeCanvas(); makeGrains(); apply();
    if (reduce) { drawDust(0); } 
    requestAnimationFrame(loop);
    window.addEventListener('resize', function () { sizeCanvas(); makeGrains(); });
})();
</script>
