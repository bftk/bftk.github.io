<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊び方 - BFTK</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="遊び方 - BFTK">
    <meta property="og:description" content="カード説明・デッキ構築・バトル。3つのカテゴリで遊び方を解説。">
    <meta property="og:url" content="https://bftk-game.com/game.html">
    <link rel="canonical" href="https://bftk-game.com/game.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BFTK">
    <meta property="og:locale" content="ja_JP">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K0TT1CMBVT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K0TT1CMBVT');
    </script>
    <style>
        /* プレイガイド 挿絵（4:3）— このページ限定。style.css は変更しない */
        /* 矢印を消したので右paddingの名残を左と揃える
           （game-deck-hub.html には矢印が4本残るので style.css では直さない） */
        .hub-panel { padding-right: 1.6rem; }
        .hub-panel .guide-figure {
            margin: -1.6rem -1.6rem 0;
            aspect-ratio: 4 / 3;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .hub-panel .guide-figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 左端の金帯は使わない（挿絵を覆うため）
           （game-deck-hub.html は文字のみなので常時表示のまま＝style.css は変更しない） */
        .hub-panel::before { display: none; }
        /* 見出しの黒帯をパネル幅いっぱいに広げ、hover で金色にする */
        .hub-panel .hub-panel-title {
            margin: 0 -1.6rem -1.6rem;
            padding: 1.6rem;
            letter-spacing: 0.03em;   /* .hub-hero-title と同値 */
            text-align: center;       /* ★試験中: 気に入らなければこの1行を消す */
            transition: background 0.3s, color 0.3s;
        }
        .hub-panel:hover .hub-panel-title {
            background: #F9A825;
            color: #0a0a0a;           /* 金地に白は読めないので文字を暗くする */
        }
        /* (1) ヒーローの上下を圧縮し、見出しとカードの距離を詰める */
        .hub-hero { padding: clamp(2.8rem, 5.6vw, 4rem) 1.5rem 2rem; }
        .hub-panels { padding-top: 1.5rem; }
        @media (max-width: 600px) {
            .hub-panel { padding-left: 1.5rem; padding-right: 1.5rem; }
            .hub-panel .guide-figure { margin: -1.5rem -1.5rem 0; }
            .hub-panel .hub-panel-title { margin: 0 -1.5rem -1.5rem; padding: 1.5rem; }
            .hub-hero { padding: 3rem 1.2rem 1.6rem; }
            .hub-panels { padding-top: 1.2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">BFTK</a>
        <div class="nav-links">
            <a href="world.html">世界観</a>
            <a href="game.html" class="active">遊び方</a>
            <a href="characters.html">勢力</a>
            <a href="faq.html">FAQ</a>
        </div>
    </nav>

    <section class="hub-hero">
        <div class="hub-hero-bg" aria-hidden="true">TERRITORY</div>
        <div class="hub-hero-inner">
            <p class="hub-hero-label">PLAY GUIDE</p>
            <h1 class="hub-hero-title">プレイガイド</h1>
        </div>
    </section>

    <section class="hub-panels">
        <div class="hub-grid hub-grid-3">
        <a href="game-card-content.html" class="hub-panel" data-reveal>
            <div class="guide-figure"><img src="assets/guide/cards.webp" alt="カードを掲げて喜ぶ2人のキャラ" width="1000" height="750" loading="lazy"></div>
            <h2 class="hub-panel-title">カード説明</h2>
        </a>
        <a href="game-deck.html" class="hub-panel" data-reveal>
            <div class="guide-figure"><img src="assets/guide/deck.webp" alt="卓を囲んで作戦を語り合う4人のキャラ" width="1000" height="750" loading="lazy"></div>
            <h2 class="hub-panel-title">デッキ構築</h2>
        </a>
        <a href="game-battle.html" class="hub-panel" data-reveal>
            <div class="guide-figure"><img src="assets/guide/battle.webp" alt="夕暮れの戦場で対峙する2人のキャラ" width="1000" height="750" loading="lazy"></div>
            <h2 class="hub-panel-title">バトル</h2>
        </a>
        </div>
    </section>

    <a href="chat.html" class="chat-fab" aria-label="キャラと話す"><img src="chat-icon.webp" alt="キャラと話す"></a>
    <footer>
        <a href="privacy.html">プライバシーポリシー</a>｜<a href="terms.html">利用規約</a>｜<a href="rates.html">提供割合</a>｜<a href="company.html">運営者情報</a>
        <p style="margin-top: 0.5rem;">&copy; HIAS</p>
    </footer>
    <script>
    document.addEventListener('DOMContentLoaded',()=>{const o=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('is-visible');o.unobserve(x.target)}})},{threshold:0.12});document.querySelectorAll('[data-reveal]').forEach(el=>o.observe(el))});
    </script>
</body>
</html>
